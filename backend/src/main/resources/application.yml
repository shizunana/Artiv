server:
  port: 8080

spring:
  application:
    name: artiv
  datasource:
    url: jdbc:mysql://localhost:3306/artiv?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 避免查询本人业务时将完整 SQL 结果行（含账户/私有内容）打印到运行日志。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

artiv:
  guide:
    enabled: ${ARTIV_GUIDE_ENABLED:false}
    provider: ${ARTIV_GUIDE_PROVIDER:deepseek}
    api-key: ${ARTIV_GUIDE_API_KEY:}
    text-model: ${ARTIV_GUIDE_TEXT_MODEL:deepseek-flash}
    vision-model: ${ARTIV_GUIDE_VISION_MODEL:deepseek-flash}
    # glm 的适配接口已预留，提供对应 Key 并完成适配验证后再启用；不复用 DeepSeek Key。
    timeout-seconds: ${ARTIV_GUIDE_REQUEST_TIMEOUT_SECONDS:90}
    max-output-tokens: ${ARTIV_GUIDE_MAX_OUTPUT_TOKENS:2048}
    max-input-chars: 4000
    max-context-chars: 24000
    max-turns: 50
    max-sessions: 100
    max-sessions-per-user: 5
    session-ttl-minutes: 1440
  jwt:
    # 生产环境务必通过环境变量 / application-local.yml 覆盖
    secret: "artiv-graduation-project-jwt-secret-key-change-me-2026"
    expire-hours: 24
  upload:
    dir: uploads
    url-prefix: /uploads
