server:
  port: 8080

spring:
  application:
    name: huiyue
  datasource:
    url: jdbc:mysql://localhost:3306/huiyue?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

huiyue:
  jwt:
    # 生产环境务必通过环境变量 / application-local.yml 覆盖
    secret: "huiyue-graduation-project-jwt-secret-key-change-me-2026"
    expire-hours: 24
  upload:
    dir: uploads
    url-prefix: /uploads
